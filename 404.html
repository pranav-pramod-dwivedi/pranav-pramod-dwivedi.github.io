<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Under Maintenance — Pranav Dwivedi</title>
  <meta name="description" content="Site is currently undergoing scheduled maintenance. We will be back soon, and better than before.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07090e">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 22, 31, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --amber: #fbbf24;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.12), transparent),
        radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.04), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
      text-align: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.25);
      color: var(--amber);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--amber);
      box-shadow: 0 0 10px var(--amber);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: clamp(1.85rem, 4vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 1.2rem;
      color: #ffffff;
    }
    h1 .highlight {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .message {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.65;
      margin-bottom: 1.5rem;
    }
    .apology {
      color: var(--text-dim);
      font-size: 0.92rem;
      line-height: 1.5;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .footer {
      margin-top: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    .footer a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.85rem;
      font-family: "JetBrains Mono", monospace;
      transition: color 0.2s ease;
    }
    .footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <main class="card">
    <div class="status-badge">
      <span class="status-dot"></span>
      Scheduled Maintenance
    </div>
    <h1>Under Maintenance &amp; <span class="highlight">Upgrading</span></h1>
    <p class="message">
      We are temporarily down for maintenance and system enhancements.<br>
      We will be back soon, and better than before.
    </p>
    <p class="apology">
      Sincere apologies for any inconvenience caused.
    </p>
    <div class="footer">
      <a href="https://github.com/pranav-pramod-dwivedi" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:hkdykk22@gmail.com">Contact</a>
    </div>
  </main>
</body>
</html>
